[project]
name = "santa-elf-calculator"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "maroofiums", email = "maroofiums@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "kaggle>=2.2.5",
    "six>=1.17.0",
]

[project.scripts]
santa-elf-calculator = "santa_elf_calculator:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]